name: Render API Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (Render spins down after 15 min inactivity)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-api:
    name: Ping Render Cloud Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging https://verity-api.onrender.com/health to prevent Render sleep..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://verity-api.onrender.com/health)
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Render API is warm and responsive!"
          else
            echo "API returned status $HTTP_STATUS (or waking up)"
          fi
