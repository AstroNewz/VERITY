<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Verity Brand Guard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    body {
      background: #FFFBEF;
      color: #111111;
      padding: 14px;
      font-size: 12px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #111111;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.3px;
    }
    .brand-subtitle {
      font-size: 9px;
      color: #555;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .status-badge {
      background: #FFE500;
      border: 1.5px solid #111111;
      font-size: 8px;
      font-weight: 800;
      padding: 2px 6px;
      text-transform: uppercase;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      background: #FFE500;
      border: 2px solid #111111;
      font-weight: 800;
      font-size: 11px;
      padding: 8px 10px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #111111;
      transition: transform 0.05s;
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    .btn-white {
      background: #FFFFFF;
      flex: 0 0 auto;
    }
    .summary-card {
      background: #FFFFFF;
      border: 2px solid #111111;
      box-shadow: 3px 3px 0px #111111;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .findings-container {
      max-height: 320px;
      overflow-y: auto;
    }
    .node-group {
      border: 2px solid #111111;
      background: #FFFFFF;
      padding: 8px;
      margin-bottom: 8px;
    }
    .node-title {
      font-size: 10px;
      font-weight: 800;
      color: #555;
      text-transform: uppercase;
      border-bottom: 1px dashed #CCC;
      padding-bottom: 3px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .finding-card {
      border-left: 3px solid #111111;
      padding: 4px 6px;
      margin-bottom: 6px;
      background: #FFFDF0;
      font-size: 11px;
    }
    .finding-critical {
      border-left-color: #FF3366;
      background: #FFF0F3;
    }
    .badge {
      display: inline-block;
      font-size: 8px;
      font-weight: 900;
      padding: 1px 4px;
      border: 1px solid #111;
      background: #FFE500;
      margin-right: 4px;
    }
    .apply-btn {
      display: inline-block;
      margin-top: 4px;
      background: #00FF66;
      border: 1.5px solid #111111;
      font-size: 9px;
      font-weight: 800;
      padding: 4px 8px;
      box-shadow: 1px 1px 0px #111111;
      cursor: pointer;
    }
    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: #666;
      border: 2px dashed #CCC;
      background: #FFFFFF;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="brand-title" style="display:flex; align-items:center; gap:6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Verity Figma Guard</span>
      </div>
      <div class="brand-subtitle">CITES BEFORE IT FLAGS • ROUND 3</div>
    </div>
    <div class="status-badge" id="api-badge">API Connected</div>
  </div>

  <div class="btn-row">
    <button id="scan-btn" style="display:flex; align-items:center; justify-content:center; gap:6px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Scan Selected Text Layers</span>
    </button>
    <button id="demo-btn" class="btn-white" title="Simulate scanning a campaign poster banner">Demo</button>
  </div>

  <div class="summary-card" id="summary-card" style="display: none;">
    <div style="display:flex; justify-content:space-between; font-weight:800; text-transform:uppercase;">
      <span>Scanned Layers: <span id="layer-count">0</span></span>
      <span id="issues-count" style="color:#FF3366;">0 Issues</span>
    </div>
  </div>

  <div class="findings-container" id="findings-container">
    <div class="empty-state" id="empty-state">
      Select any text layer or artboard on your Figma canvas and click <strong>"Scan Selected Text Layers"</strong>.
    </div>
  </div>

  <script>
    const API_BASE = "https://verity-api.onrender.com";
    let scannedNodes = [];

    document.getElementById("scan-btn").addEventListener("click", () => {
      parent.postMessage({ pluginMessage: { type: "SCAN_SELECTION" } }, "*");
    });

    document.getElementById("demo-btn").addEventListener("click", () => {
      // Demo test payload
      const demoNodes = [
        {
          id: "demo-node-1",
          name: "Headline",
          text: "NovaFest 2026 is back and it is CHEAP!"
        },
        {
          id: "demo-node-2",
          name: "Subheadline",
          text: "We are the #1 student festival in India with 10,000+ attendees."
        },
        {
          id: "demo-node-3",
          name: "Footer Callout",
          text: "Do not mention Project Falcon to campus press."
        }
      ];
      handleScanResults(demoNodes);
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "SCAN_RESULT") {
        if (msg.nodes.length > 0) {
          handleScanResults(msg.nodes);
        }
      }

      if (msg.type === "FIX_SUCCESS") {
        const btn = document.querySelector(`[data-apply-node="${msg.nodeId}"]`);
        if (btn) {
          btn.textContent = "Fix Applied to Canvas Layer";
          btn.style.background = "#FFE500";
        }
      }
    };

    async function handleScanResults(nodes) {
      scannedNodes = nodes;
      document.getElementById("empty-state").style.display = "none";
      const summaryCard = document.getElementById("summary-card");
      summaryCard.style.display = "block";
      document.getElementById("layer-count").textContent = nodes.length;

      const container = document.getElementById("findings-container");
      container.innerHTML = "<div style='text-align:center; padding:20px; font-weight:bold;'>Inspecting Brand Constitution & Claims...</div>";

      let totalIssues = 0;
      let html = "";

      for (const node of nodes) {
        const findings = await analyzeNodeText(node.text);
        totalIssues += findings.length;

        html += `
          <div class="node-group">
            <div class="node-title">
              <span>Layer: "${escapeHtml(node.name)}"</span>
              <span>${findings.length} ISSUE${findings.length === 1 ? "" : "S"}</span>
            </div>
            <div style="font-size:10px; color:#444; margin-bottom:6px; font-style:italic;">
              "${escapeHtml(node.text)}"
            </div>
        `;

        if (findings.length === 0) {
          html += `
            <div style="font-size:10px; color:#00AA44; font-weight:bold; display:flex; align-items:center; gap:4px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00AA44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>100% Brand Compliant</span>
            </div>
          `;
        } else {
          findings.forEach((f) => {
            const isCrit = f.severity === "critical";
            const newText = node.text.replace(new RegExp(escapeRegExp(f.original_phrase), "i"), f.suggested_fix);
            html += `
              <div class="finding-card ${isCrit ? "finding-critical" : ""}">
                <div>
                  <span class="badge">${f.rule_id}</span>
                  <strong>${escapeHtml(f.original_phrase)}</strong>
                </div>
                <div style="font-size:10px; color:#333; margin:2px 0;">
                  ${escapeHtml(f.explanation || f.message)}
                </div>
                <div style="font-size:8px; font-family:monospace; color:#666;">
                  Cited: ${escapeHtml(f.source_cited)}
                </div>
                ${
                  f.suggested_fix
                    ? `<button class="apply-btn" data-apply-node="${node.id}" data-new-text="${encodeURIComponent(newText)}">
                        Apply to Layer: "${escapeHtml(f.suggested_fix)}"
                       </button>`
                    : ""
                }
              </div>
            `;
          });
        }

        html += `</div>`;
      }

      document.getElementById("issues-count").textContent = `${totalIssues} Issues Cited`;
      container.innerHTML = html;

      // Wire up layer fix buttons
      document.querySelectorAll(".apply-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          const nodeId = e.target.dataset.applyNode;
          const newText = decodeURIComponent(e.target.dataset.newText);
          parent.postMessage(
            {
              pluginMessage: {
                type: "APPLY_FIX",
                nodeId: nodeId,
                newText: newText
              }
            },
            "*"
          );
        });
      });
    }

    async function analyzeNodeText(text) {
      try {
        const createRes = await fetch(`${API_BASE}/api/v1/submissions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: "Figma Inspection",
            original_text: text,
            input_type: "text"
          }),
          signal: AbortSignal.timeout(5000)
        });
        const sub = await createRes.json();
        const anaRes = await fetch(`${API_BASE}/api/v1/submissions/${sub.id}/analyze`, {
          method: "POST",
          signal: AbortSignal.timeout(6000)
        });
        const data = await anaRes.json();
        return data.findings || [];
      } catch (_) {
        return fallbackRules(text);
      }
    }

    function fallbackRules(text) {
      const list = [];
      if (/CHEAP/i.test(text)) {
        list.push({
          rule_id: "T-3",
          severity: "warning",
          original_phrase: "CHEAP",
          suggested_fix: "accessible",
          explanation: "Tone Hygiene: Avoid 'cheap'; use 'accessible' or 'budget-friendly'.",
          source_cited: "Constitution §4: Tone Hygiene"
        });
      }
      if (/#1\s+student\s+fest/i.test(text) || /#1\s+in\s+India/i.test(text)) {
        list.push({
          rule_id: "C-1",
          severity: "critical",
          original_phrase: "#1 student festival in India",
          suggested_fix: "premier collegiate festival in India",
          explanation: "Unverified Superlative: No documented source supports '#1'.",
          source_cited: "Claim Ledger entry CL-003"
        });
      }
      if (/Project\s+Falcon/i.test(text)) {
        list.push({
          rule_id: "P-1",
          severity: "critical",
          original_phrase: "Project Falcon",
          suggested_fix: "[REDACTED CONFIDENTIAL]",
          explanation: "Confidentiality Breach: Project Falcon is restricted under NDA.",
          source_cited: "Constitution §6: Confidential Terms"
        });
      }
      return list;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }
  </script>
</body>
</html>
